<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <clipPath id="circleClipSleep">
      <circle cx="36" cy="36" r="34"/>
    </clipPath>
  </defs>
  <!-- 粉色珊瑚圓形底圖 -->
  <circle cx="36" cy="36" r="35" fill="#F9D3CE" stroke="#F19689" stroke-width="2"/>
  <g clip-path="url(#circleClipSleep)">
    <!-- 珊瑚粉小睡墊 -->
    <ellipse cx="36" cy="52" rx="25" ry="9" fill="#F19689" opacity="0.45"/>
    <!-- 捲成一團睡覺的身體 -->
    <ellipse cx="39" cy="46" rx="17" ry="11" fill="#FFFFFF" stroke="#5A3328" stroke-width="1.8"/>
    <!-- 尾巴捲在旁邊 -->
    <path d="M52 49c4 0 6-3 4-6-1.5 1-3 2.5-5 3.5z" fill="#FDE4CF" stroke="#5A3328" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 頭部靠在前腳上 -->
    <ellipse cx="27" cy="40" rx="13.5" ry="11.2" fill="#FFFFFF" stroke="#5A3328" stroke-width="1.8"/>
    <!-- 垂耳蓋住臉側 -->
    <path d="M15.5 34c-3.5 2-4.8 7.8-2.2 11.2 1.5 2 3.5.5 4-2.4.5-3 0-6.5-1.8-8.8z" fill="#FDE4CF" stroke="#5A3328" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M38.5 34c3.5 2 4.8 7.8 2.2 11.2-1.5 2-3.5.5-4-2.4-.5-3 0-6.5 1.8-8.8z" fill="#FDE4CF" stroke="#5A3328" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- 閉眼安詳微笑 (U字形閉眼) -->
    <path d="M20.5 39c1.2 1.6 3.2 1.6 4.4 0" fill="none" stroke="#4A281E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M29.5 39c1.2 1.6 3.2 1.6 4.4 0" fill="none" stroke="#4A281E" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 珊瑚粉腮紅 -->
    <ellipse cx="18.5" cy="42.5" rx="2.8" ry="1.8" fill="#F19689" opacity="0.85"/>
    <ellipse cx="35.5" cy="42.5" rx="2.8" ry="1.8" fill="#F19689" opacity="0.85"/>
    <!-- 鼻子與安穩小嘴 -->
    <ellipse cx="27" cy="42" rx="2.3" ry="1.6" fill="#5A3328"/>
    <path d="M25.2 44.8c1 .9 2.6.9 3.6 0" fill="none" stroke="#5A3328" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 小手墊在下巴旁 -->
    <ellipse cx="21" cy="50.5" rx="4.5" ry="2.5" fill="#FFFFFF" stroke="#5A3328" stroke-width="1.6"/>
    <!-- Zzz 睡眠符號 -->
    <text x="43" y="29" font-family="Arial Rounded MT Bold, sans-serif" font-size="8.5" font-weight="900" fill="#E57C6E">Z</text>
    <text x="50" y="23" font-family="Arial Rounded MT Bold, sans-serif" font-size="6.8" font-weight="900" fill="#E57C6E" opacity="0.85">z</text>
    <text x="55" y="18.5" font-family="Arial Rounded MT Bold, sans-serif" font-size="5.5" font-weight="900" fill="#E57C6E" opacity="0.7">z</text>
  </g>
</svg>
