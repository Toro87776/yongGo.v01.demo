<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YongGO 養狗 - 坐下訓練計時</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e4edd1;
            color: #393939;
            margin: 0;
            padding: 0;
        }
        .app-viewport {
            width: 100%;
            max-width: 480px;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: #fffcf4;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 760px) {
            .app-viewport {
                max-width: 100%;
            }
        }
        .pause-btn {
            background-color: #2f553c;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(47, 85, 60, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.18);
            transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
        }
        .pause-btn:hover {
            background-color: #254530;
        }
        .pause-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(47, 85, 60, 0.22);
        }
        .back-center-btn {
            background-color: #e4edd1;
            color: #2f553c;
            border: 1.5px solid #cfe0b0;
            box-shadow: 0 4px 12px rgba(47, 85, 60, 0.08), inset 0 2px 2px rgba(255, 255, 255, 0.6);
            transition: transform 0.16s ease, background-color 0.16s ease;
        }
        .back-center-btn:hover {
            background-color: #d7e5bc;
        }
        .back-center-btn:active {
            transform: scale(0.97);
        }

        /* 3D 實體立體鐘錶外框與內凹槽 */
        .clock-3d-shell {
            background: radial-gradient(circle at 30% 25%, #ffffff 0%, #fff7f2 60%, #f8e5e0 100%);
            box-shadow:
                0 18px 36px rgba(47, 85, 60, 0.14),
                0 6px 12px rgba(255, 104, 82, 0.14),
                inset 0 4px 10px rgba(255, 255, 255, 0.9),
                inset 0 -6px 14px rgba(229, 130, 118, 0.18);
        }
        .clock-3d-dial {
            background: radial-gradient(circle at 35% 28%, #ffffff 0%, #fffcf4 68%, #f3ebd9 100%);
            box-shadow:
                0 10px 22px rgba(47, 85, 60, 0.14),
                inset 0 3px 6px rgba(255, 255, 255, 0.95),
                inset 0 -4px 10px rgba(47, 85, 60, 0.08);
        }
        .progress-ring-circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.95s linear;
        }
        .music-btn {
            transition: transform 0.16s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .music-btn:active {
            transform: scale(0.94);
        }
        .music-btn.playing {
            background-color: #e4edd1;
            border-color: #2f553c;
            animation: musicPulse 2s ease-in-out infinite;
        }
        @keyframes musicPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen">
    <div class="app-viewport">
        <header class="px-5 pt-6 pb-3 flex items-center justify-between bg-[#fffcf4]">
            <button type="button" onclick="location.href='training_instruction_sit.html'" aria-label="返回" class="w-10 h-10 rounded-full bg-white border border-[#e4edd1] shadow-xs flex items-center justify-center text-[#2f553c]">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <h1 class="text-xl font-black text-[#393939] text-center flex-1 tracking-tight">坐下訓練計時</h1>
            <button type="button" id="music-toggle-btn" onclick="toggleTrainingMusic()" aria-label="播放輕快倒數音樂" title="播放輕快倒數音樂" aria-pressed="false" class="music-btn w-10 h-10 rounded-full bg-white border border-[#e4edd1] shadow-xs flex items-center justify-center text-[#2f553c]">
                <i class="fa-solid fa-music text-sm" aria-hidden="true"></i>
            </button>
            <audio id="training-music" src="./audio/upbeat_training.mp3" loop preload="none"></audio>
        </header>

        <main class="px-5 py-4 flex-1 flex flex-col items-center justify-center space-y-7 text-center">
            <!-- 3D 立體順時針圓形倒數計時器 -->
            <div class="clock-3d-shell relative w-72 h-72 rounded-full flex items-center justify-center p-2">
                <svg class="w-full h-full" viewBox="0 0 220 220">
                    <defs>
                        <!-- 3D 漸層珊瑚紅環 (未經過時間) -->
                        <linearGradient id="ring3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFA092" />
                            <stop offset="50%" stop-color="#FF6852" />
                            <stop offset="100%" stop-color="#E34D38" />
                        </linearGradient>
                        <!-- 3D 漸層粉紅環 (已順時針倒數變粉紅的區域) -->
                        <linearGradient id="pinkTrack3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFE6E2" />
                            <stop offset="50%" stop-color="#F9D3CE" />
                            <stop offset="100%" stop-color="#F2BEB6" />
                        </linearGradient>
                        <!-- 立體陰影濾鏡 -->
                        <filter id="ring3dShadow" x="-15%" y="-15%" width="130%" height="130%">
                            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D94B38" flood-opacity="0.35" />
                        </filter>
                        <filter id="pink3dShadow" x="-15%" y="-15%" width="130%" height="130%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D99B92" flood-opacity="0.28" />
                        </filter>
                    </defs>

                    <!-- 淺粉 3D 立體底環（倒數越多、順時針露出越多立體粉紅） -->
                    <circle cx="110" cy="110" r="90" stroke="url(#pinkTrack3dGrad)" stroke-width="18" fill="none" filter="url(#pink3dShadow)" />
                    <!-- 微高光底線增強粉紅 3D 層次 -->
                    <circle cx="110" cy="110" r="90" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />

                    <!-- 順時針縮減的 3D 珊瑚紅進度環（俐落時鐘切線） -->
                    <circle id="progress-ring" cx="110" cy="110" r="90"
                        stroke="url(#ring3dGrad)" stroke-width="18" fill="none"
                        stroke-dasharray="565.49" stroke-dashoffset="0" stroke-linecap="butt"
                        filter="url(#ring3dShadow)"
                        class="progress-ring-circle" />
                </svg>

                <!-- 中央浮雕質感白色錶盤 -->
                <div class="clock-3d-dial absolute w-48 h-48 rounded-full flex flex-col items-center justify-center">
                    <div id="timer-display" class="text-6xl font-black text-[#2f553c] tracking-wide select-none drop-shadow-[0_2px_2px_rgba(47,85,60,0.12)]">6:00</div>
                </div>
            </div>
            <p class="text-base font-bold text-[#393939]/75">保持冷靜與耐心，適時休息給予小顆零食獎勵，</p>

            <div class="w-full space-y-3 pt-1">
                <button type="button" id="toggle-timer-btn" onclick="toggleTimer()" class="pause-btn w-full py-3.5 rounded-full text-base font-black tracking-wider">
                    暫停計時
                </button>
                <button type="button" onclick="location.href='training_center.html'" class="back-center-btn w-full py-3.5 rounded-full text-sm font-black tracking-wide">
                    完成並返回訓練中心
                </button>
            </div>
        </main>
    </div>

    <script>
        const TOTAL_SECONDS = 360; // 6:00
        const CIRCUMFERENCE = 2 * Math.PI * 90; // 565.49
        let secondsLeft = TOTAL_SECONDS;
        let running = true;

        const display = document.getElementById('timer-display');
        const ring = document.getElementById('progress-ring');
        const toggleBtn = document.getElementById('toggle-timer-btn');

        let alertAudioCtx = null;
        let threeMinAlertPlayed = false;

        function unlockAlertAudio() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            if (!alertAudioCtx) {
                alertAudioCtx = new AudioCtx();
            }
            if (alertAudioCtx.state === 'suspended') {
                alertAudioCtx.resume().catch(() => {});
            }
        }
        window.addEventListener('pointerdown', unlockAlertAudio, { once: true });
        window.addEventListener('keydown', unlockAlertAudio, { once: true });

        // 剩餘 3 分鐘 (180 秒) 時發出「逼逼叫」警示音（3 聲短促提示音）
        function playThreeMinBeep() {
            unlockAlertAudio();
            if (!alertAudioCtx) return;
            const now = alertAudioCtx.currentTime;
            [0, 0.26, 0.52].forEach((offset) => {
                const osc = alertAudioCtx.createOscillator();
                const gain = alertAudioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now + offset);
                gain.gain.setValueAtTime(0.001, now + offset);
                gain.gain.exponentialRampToValueAtTime(0.28, now + offset + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.16);
                osc.connect(gain);
                gain.connect(alertAudioCtx.destination);
                osc.start(now + offset);
                osc.stop(now + offset + 0.17);
            });
        }

        ring.style.strokeDasharray = CIRCUMFERENCE;

        function updateTimerUI() {
            const m = Math.floor(secondsLeft / 60);
            const s = String(secondsLeft % 60).padStart(2, '0');
            display.textContent = `${m}:${s}`;

            // 使用負值 strokeDashoffset 讓進度環自 12 點鐘方向「順時針」遞減
            const elapsedRatio = (TOTAL_SECONDS - secondsLeft) / TOTAL_SECONDS;
            ring.style.strokeDashoffset = (-CIRCUMFERENCE * elapsedRatio).toFixed(2);
        }

        updateTimerUI();

        setInterval(() => {
            if (!running || secondsLeft <= 0) return;
            secondsLeft -= 1;
            updateTimerUI();
            if (secondsLeft === 180 && !threeMinAlertPlayed) {
                threeMinAlertPlayed = true;
                playThreeMinBeep();
            }
            if (secondsLeft === 0) {
                running = false;
                toggleBtn.textContent = '重新開始 (6:00)';
            }
        }, 1000);

        function toggleTimer() {
            unlockAlertAudio();
            if (secondsLeft === 0) {
                secondsLeft = TOTAL_SECONDS;
                threeMinAlertPlayed = false;
                running = true;
                toggleBtn.textContent = '暫停計時';
                updateTimerUI();
                return;
            }
            running = !running;
            toggleBtn.textContent = running ? '暫停計時' : '繼續計時';
        }

        const trainingMusic = document.getElementById('training-music');
        const musicToggleBtn = document.getElementById('music-toggle-btn');
        if (trainingMusic) trainingMusic.volume = 0.45;

        async function toggleTrainingMusic() {
            if (!trainingMusic || !musicToggleBtn) return;
            if (trainingMusic.paused) {
                try {
                    await trainingMusic.play();
                    musicToggleBtn.classList.add('playing');
                    musicToggleBtn.setAttribute('aria-pressed', 'true');
                    musicToggleBtn.title = '暫停輕快倒數音樂';
                } catch (e) {}
            } else {
                trainingMusic.pause();
                musicToggleBtn.classList.remove('playing');
                musicToggleBtn.setAttribute('aria-pressed', 'false');
                musicToggleBtn.title = '播放輕快倒數音樂';
            }
        }
    </script>
</body>
</html>
