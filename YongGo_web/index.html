<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YongGO 養狗 - App 首頁</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 圓潤字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2f5537', // 主色 墨綠
                            light: '#e4edd1',   // 輔色 淺粉綠
                            cream: '#fffcf4',   // 淺粉黃 (背景)
                            pinkSoft: '#F9D3CE',// 淺粉紅
                            pink: '#F19689',    // 粉紅 (重要資訊/進度/按鈕)
                            dark: '#1e3824'
                        }
                    },
                    borderRadius: {
                        'app': '24px',
                        'app-sm': '16px'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #dce5da;
            color: #2f5537;
            margin: 0;
            padding: 0;
        }

        /* 手機容器規畫 (無外框圓角、無上下邊距，760px 以下滿版流暢顯示) */
        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            margin: 0 auto;
            background-color: #fffcf4;
            position: relative;
            box-shadow: 0 0 24px rgba(33, 61, 39, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 0;
        }

        @media (max-width: 760px) {
            .app-viewport {
                max-width: 100%;
                box-shadow: none;
            }
        }

        .app-viewport > header {
            flex: 0 0 auto;
        }

        .app-viewport > main {
            flex: 1 1 auto;
            overflow-y: auto;
            overscroll-behavior: contain;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .app-viewport > main::-webkit-scrollbar {
            display: none;
        }

        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 圓形進度環動畫風格 */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* 助理人物超出一角彈出效果 */
        .ai-assistant-img {
            filter: drop-shadow(0px 8px 12px rgba(47, 85, 55, 0.15));
        }

        /* 互動微動畫 */
        .touch-active:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }

        /* 每天6分鐘訓練：彈性粉紅漸層 Bar 與立體播放鈕 */
        .training-pink-bar {
            background-image: url('./image/bar.png'), linear-gradient(90deg, #ffbeb5 0%, #ffeae7 100%);
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }
        .training-3d-play-btn {
            filter: drop-shadow(0 5px 8px rgba(229, 108, 92, 0.38));
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease !important;
            will-change: transform;
            touch-action: none;
            user-select: none;
        }
        .training-3d-play-btn:hover {
            filter: drop-shadow(0 6px 10px rgba(229, 108, 92, 0.45));
        }
        .training-3d-play-btn.is-dragging {
            transition: none !important;
            filter: drop-shadow(0 2px 4px rgba(229, 108, 92, 0.32)) !important;
        }
        .training-3d-play-btn:active:not(.is-dragging) {
            transform: scale(0.86) translateY(2px) !important;
            filter: drop-shadow(0 2px 3px rgba(229, 108, 92, 0.3)) !important;
        }

        /* Dr.Yong 3D 圓形頭像輕量 GPU 動畫 (呼吸浮動 + 親和微傾 + 柔和光圈) */
        @keyframes drYongFloat {
            0%, 100% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }
            35% {
                transform: translate3d(0, -4px, 0) rotate(-2deg) scale(1.03);
            }
            70% {
                transform: translate3d(0, -2px, 0) rotate(2deg) scale(1.02);
            }
        }
        @keyframes drYongPulseRing {
            0% {
                transform: scale(0.95);
                opacity: 0.65;
            }
            70% {
                transform: scale(1.16);
                opacity: 0;
            }
            100% {
                transform: scale(1.16);
                opacity: 0;
            }
        }
        .dr-yong-badge {
            will-change: transform;
            animation: drYongFloat 3.6s ease-in-out infinite;
        }
        .dr-yong-badge::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            border: 2px solid #F19689;
            pointer-events: none;
            will-change: transform, opacity;
            animation: drYongPulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .dr-yong-badge:hover {
            animation-play-state: paused;
            transform: scale(1.06);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">
    <div class="app-viewport">
        <!-- 頂部 Header 區塊 (Logo與頭像) -->
        <header class="px-5 pt-6 pb-2 flex items-center justify-between bg-[#fffcf4]">
            <!-- 左側品牌 Logo -->
            <div class="flex items-center space-x-2">
                <div class="w-9 h-7">
                    <img src="./image/logo-s.png" alt="YongGO Logo" class="w-full h-full object-contain">
                </div>
                <span class="text-xl font-black text-brand italic tracking-tight" style="font-style: italic;">YongGO</span>
            </div>

            <!-- 右上雙圓形頭像 (飼主頭像 + 狗狗頭像) -->
            <div onclick="location.href='personal_setting.html'" class="flex items-center -space-x-2 cursor-pointer touch-active" title="前往個人與設定">
                <!-- 飼主頭像 -->
                <div class="w-10 h-10 rounded-full border-2 border-[#fffcf4] overflow-hidden shadow-sm bg-brand-light flex items-center justify-center relative z-10">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="飼主頭像" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/e4edd1/2f5537?text=Owner'">
                </div>
                <!-- 狗狗頭像 -->
                <div class="w-10 h-10 rounded-full border-2 border-[#fffcf4] overflow-hidden shadow-sm bg-brand-pinkSoft flex items-center justify-center relative z-20">
                    <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=150&q=80" alt="狗狗頭像" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/F9D3CE/2f5537?text=Dog'">
                </div>
            </div>
        </header>

        <!-- 主要內容區域 (四個重點橫向矩形區塊與模組) -->
        <main class="px-5 py-3 space-y-5 flex-1">

            <!-- 區塊 1: 每天 6 分鐘區 (參考手機畫面視覺設計) -->
            <section class="bg-brand-light rounded-app p-4 shadow-sm border border-brand/5 relative overflow-hidden">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="font-extrabold text-brand text-lg flex items-center gap-1.5">

                </div>

                <!-- 彈性伸縮粉紅漸層 Bar：左側可拖曳立體播放鈕 + 中間動作名稱 + 右側狗狗(上層較大) -->
                <div class="relative flex items-center my-4 min-h-[76px] w-full">
                    <!-- 粉紅漸層彈性 Bar -->
                    <div id="training-drag-track" onclick="if (event.target.id === 'training-drag-track') location.href='training_instruction_sit.html';" class="training-pink-bar w-full h-16 rounded-full flex items-center justify-between pl-1.5 pr-20 shadow-sm relative z-10 overflow-hidden cursor-pointer">
                        <!-- 左側立體可拖曳播放按鈕（從左拖曳到右觸發狗狗動畫） -->
                        <button id="training-drag-btn" type="button" aria-label="向右拖曳開始坐下訓練" title="向右拖曳開始坐下訓練" class="training-3d-play-btn w-14 h-14 rounded-full shrink-0 flex items-center justify-center cursor-grab active:cursor-grabbing focus:outline-none relative z-20">
                            <img src="./image/button.png" alt="拖曳開始" class="w-full h-full object-contain pointer-events-none select-none">
                        </button>
                        <span id="training-bar-label" class="flex-1 text-center text-xl font-black text-[#4d4d4d] tracking-wider select-none pointer-events-none">坐下</span>
                    </div>
                    <!-- 右側可愛立體狗狗（比左側按鈕大，位於 Bar 上層右區） -->
                    <img id="training-dog-img" src="./image/sit.png" alt="坐下訓練狗狗" class="w-20 h-20 object-contain absolute right-0 top-1/2 -translate-y-1/2 z-20 pointer-events-none select-none drop-shadow-[0_6px_10px_rgba(47,85,55,0.18)]">
                </div>

                <!-- 備註說明：點擊 2-4 個月狗狗訓練進度 -->
                <button onclick="location.href='training_center.html?tab=B'" class="w-full mt-2 py-2 px-3 bg-white/80 hover:bg-white rounded-app-sm flex items-center justify-between text-xs text-brand font-bold transition-all border border-brand/10 touch-active">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-[#2f5537] fa-calendar-check text-brand"></i> 
                        2-4個月幼犬訓練進度 (8週循環)
                    </span>
                    <i class="fa-solid fa-chevron-right text-brand/40 text-xs"></i>
                </button>
            </section>

            <!-- 區塊 2: 常用任務 -->
            <section class="space-y-2">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-sm font-extrabold text-brand">常用任務快捷</h3>
                    <span class="text-xs text-brand/60">一鍵開始</span>
                </div>
                <div class="grid grid-cols-3 gap-2.5">
                    <!-- 任務 1: 坐下 -->
                    <button onclick="triggerAction('開始：訓練倒數')" class="bg-white p-3 rounded-app-sm border border-brand-light flex flex-col items-center justify-between shadow-2xs touch-active h-24">
                        <span class="text-sm font-bold text-brand">倒數</span>
                        <div class="w-8 h-8 rounded-full bg-brand-light text-brand flex items-center justify-center">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </div>
                    </button>

                    <!-- 任務 2: 握手 -->
                    <button onclick="triggerAction('開始：握手訓練')" class="bg-white p-3 rounded-app-sm border border-brand-light flex flex-col items-center justify-between shadow-2xs touch-active h-24">
                        <span class="text-sm font-bold text-brand">握手</span>
                        <div class="w-8 h-8 rounded-full bg-brand-light text-brand flex items-center justify-center">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </div>
                    </button>

                    <!-- 任務 3: 尿尿 -->
                    <button onclick="triggerAction('開始：定點定時尿尿訓練')" class="bg-white p-3 rounded-app-sm border border-brand-light flex flex-col items-center justify-between shadow-2xs touch-active h-24">
                        <span class="text-sm font-bold text-brand">尿尿</span>
                        <div class="w-8 h-8 rounded-full bg-brand-light text-brand flex items-center justify-center">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </div>
                    </button>
                </div>
            </section>

            <!-- 區塊 3: Dr.Yong寵物專家 (3D 教練圓形動態頭像) -->
            <section class="relative pt-6">
                <!-- 右側圓形寵物專家 3D 動態頭像 -->
                <div onclick="location.href='ai_chat.html'" title="Dr.Yong寵物專家 (點擊開始諮詢)" class="dr-yong-badge absolute -top-2 right-4 w-24 h-24 rounded-full bg-brand-light border-4 border-[#fffcf4] flex items-center justify-center shadow-md z-10 cursor-pointer touch-active">
                    <img src="./image/dr_yong_avatar.png" alt="Dr.Yong 3D 寵物專家" class="w-full h-full rounded-full object-cover">
                    <span class="absolute bottom-1 right-1 w-3.5 h-3.5 rounded-full bg-[#6eaa67] border-2 border-[#fffcf4]"></span>
                </div>

                <!-- 大矩形容器 -->
                <div class="bg-brand text-white rounded-app p-4 pt-5 shadow-md relative z-0 overflow-hidden">
                    <div class="w-2/3 space-y-2">
                        <div class="inline-block bg-brand-pink text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold tracking-wide">
                            AI 諮詢顧問
                        </div>
                        <h3 onclick="location.href='ai_chat.html'" class="text-base font-black tracking-wide leading-tight cursor-pointer hover:underline">Dr.Yong寵物專家</h3>
                        <p class="text-xs text-brand-light/90 leading-snug">
                            Dr.Yong寵物專家回答你任何狗狗的問題！
                        </p>

                        <!-- Bar 1: 幼犬黃金成長期 -->
                        <div onclick="location.href='training_center.html?tab=B'" class="bg-white/10 hover:bg-white/20 p-2 rounded-app-sm flex items-center justify-between cursor-pointer border border-white/15 touch-active">
                            <span class="text-xs font-bold text-brand-cream flex items-center gap-1.5">

                            <i class="fa-solid fa-angle-right text-xs text-brand-light"></i>

                        <!-- Bar 2: 教養心法 -->

                            <span class="text-xs font-bold text-brand-cream flex items-center gap-1.5">
                                <i class="fa-solid fa-heart text-brand-pink text-xs"></i> 養狗教養心法
                            </span>

                    </div>

            <!-- 區塊 4: 健康日誌區 -->
            <section onclick="location.href='healthjourney.html'" class="bg-white rounded-app p-4 shadow-sm border border-brand-light flex items-center justify-between cursor-pointer touch-active">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 rounded-app-sm bg-brand-pinkSoft text-brand-pink flex items-center justify-center text-xl shadow-2xs">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-brand text-base">健康日誌區</h3>
                        <p class="text-xs text-gray-500 font-medium">拍照寫下狗狗的成長點滴...</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-brand-cream flex items-center justify-center text-brand">
                    <i class="fa-solid fa-camera text-sm"></i>
                </div>
            </section>
            <!-- 區塊 5: 闖關機制 (等級與成就卡片) -->
            <section class="bg-white rounded-app p-4 shadow-sm border border-brand-light space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 rounded-full bg-brand text-white flex items-center justify-center text-xs">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="font-extrabold text-brand text-base">闖關進度等級</h3>
                    </div>
                    <span class="text-xs font-extrabold text-brand-pink bg-brand-pinkSoft/40 px-2.5 py-1 rounded-full">
                        LV. 2 成長中
                    </span>
                </div>

                <!-- 卡片身份：養育銅牌專家卡 -->
                <div class="bg-gradient-to-br from-[#d49a6a] to-[#a86c3d] text-white p-4 rounded-app-sm shadow-md relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 opacity-20 text-white text-7xl">
                        <i class="fa-solid fa-paw"></i>
                    </div>
                    
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <span class="text-[10px] tracking-wider uppercase opacity-80 font-bold block">CURRENT RANK</span>
                            <h4 class="text-lg font-black tracking-wide">養育銅牌專家</h4>
                        </div>
                        <!-- 銅狗腳印 Icon -->
                        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 text-white text-xl">
                            <i class="fa-solid fa-paw"></i>
                        </div>
                    </div>

                    <div class="mt-4 pt-2 border-t border-white/20 flex items-center justify-between text-xs relative z-10">
                        <span id="home-owner-dog-info" class="font-bold opacity-90">飼主：Alex (狗狗: 薇寶)</span>
                        <span class="bg-black/20 px-2 py-0.5 rounded-full font-mono">ID: #YG-8839</span>
                    </div>
                </div>

                <!-- 進度備註 -->
                <div class="bg-brand-cream p-3 rounded-app-sm border border-brand/5 space-y-1.5">

                        <span>距離升級「銀牌專家」</span>
                        <span class="text-brand-pink font-extrabold">還差 18 次</span>
                    </div>
                    <!-- 進度條 -->

                        <div class="bg-brand-pink h-full rounded-full" style="width: 64%;"></div>
                    </div>
                    <p class="text-[11px] text-gray-500 text-right font-medium">

        </main>

        <!-- 固定底部 Navigation (深綠色 Icon 5區) -->
        <nav class="shrink-0 w-full bg-white border-t border-gray-100 px-3 py-2 flex justify-around items-center z-50 rounded-t-2xl shadow-lg">
            
            <!-- 1. 首頁 (Active) -->
            <button onclick="location.href='index.html'" class="flex flex-col items-center py-1 px-3 text-brand font-black">
                <i class="fa-solid fa-house text-xl mb-0.5"></i>
                <span class="text-[11px]">首頁</span>
            </button>

            <!-- 2. 訓練 -->
            <button onclick="location.href='training_center.html'" class="flex flex-col items-center py-1 px-3 text-brand/50 hover:text-brand font-bold transition-colors">
                <i class="fa-solid fa-bone text-xl mb-0.5"></i>
                <span class="text-[11px]">訓練</span>
            </button>

            <!-- 3. 紀錄 -->
            <button onclick="location.href='healthjourney.html'" class="flex flex-col items-center py-1 px-3 text-brand/50 hover:text-brand font-bold transition-colors">
                <i class="fa-regular fa-clipboard text-xl mb-0.5"></i>
                <span class="text-[11px]">紀錄</span>
            </button>

            <!-- 4. AI助教 -->
            <button onclick="location.href='ai_chat.html'" class="flex flex-col items-center py-1 px-3 text-brand/50 hover:text-brand font-bold transition-colors relative">

        </nav>

    </div>

    <!-- 自訂軟圓彈窗對話框 (無系統 alert) -->
    <div id="app-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="modal-card" class="bg-[#fffcf4] rounded-app p-5 w-4/5 max-w-xs text-center shadow-2xl border-2 border-brand-light transform scale-90 transition-transform duration-200">
            <div class="w-12 h-12 bg-brand-light text-brand rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-paw"></i>
            </div>
            <h4 id="modal-title" class="text-base font-extrabold text-brand mb-1.5">提示</h4>
            <p id="modal-msg" class="text-xs text-gray-600 mb-5 font-medium leading-relaxed">訊息內容...</p>
            <button onclick="closeAppModal()" class="w-full py-2.5 bg-brand hover:bg-brand-dark text-white font-bold text-sm rounded-app-sm shadow-sm touch-active">
                我知道了
            </button>
        </div>
    </div>

    <!-- 全域資料同步與頁面邏輯 JS -->
    <script src="script.js"></script>
    <script>
        // 模擬按鈕與卡片點擊觸發
        function triggerAction(actionName) {
            showAppModal('操作提示', `您點擊了「${actionName}」功能。`);
        }

        // 底部 NAV 切換視覺體驗
        function switchNav(element, name) {
            const allNavs = element.parentElement.querySelectorAll('button');
            allNavs.forEach(nav => {
                nav.className = 'flex flex-col items-center py-1 px-3 text-brand/50 hover:text-brand font-bold transition-colors';
            });
            element.className = 'flex flex-col items-center py-1 px-3 text-brand font-black';
            showAppModal('頁面切換', `切換至「${name}」分頁`);
        }

        // 顯示對話框
        function showAppModal(title, message) {
            const modal = document.getElementById('app-modal');
            const card = document.getElementById('modal-card');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-msg').textContent = message;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        // 關閉對話框
        function closeAppModal() {
            const modal = document.getElementById('app-modal');
            const card = document.getElementById('modal-card');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // 粉紅 Bar 拖曳互動：當按鈕從左拖曳到右時，右側 sit.png 切換為 sit_anim.gif 動態動作
        (function initTrainingDragBar() {
            const track = document.getElementById('training-drag-track');
            const btn = document.getElementById('training-drag-btn');
            const dogImg = document.getElementById('training-dog-img');
            if (!track || !btn || !dogImg) return;

            let dragging = false;
            let startX = 0;
            let currentX = 0;
            let maxX = 0;
            let triggered = false;

            function getMaxX() {
                // 扣除左側 padding (6px)、按鈕寬度與右側預留給狗狗的空間 (80px)
                return Math.max(40, track.clientWidth - btn.offsetWidth - 86);
            }

            btn.addEventListener('pointerdown', (e) => {
                dragging = true;
                triggered = false;
                startX = e.clientX;
                maxX = getMaxX();
                btn.classList.add('is-dragging');
                btn.setPointerCapture(e.pointerId);
            });

            btn.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX;
                currentX = Math.max(0, Math.min(maxX, dx));
                btn.style.transform = `translateX(${currentX}px) scale(0.88)`;

                if (!triggered && currentX >= maxX * 0.72) {
                    triggered = true;
                    // 觸發狗狗 GIF 動態（站起來 -> 點頭 -> 開嘴 -> 坐下），隨後跳轉至坐下訓練指引頁
                    dogImg.src = `./image/sit_anim.gif?t=${Date.now()}`;
                    setTimeout(() => {
                        location.href = 'training_instruction_sit.html';
                    }, 800);
                }
            });

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                btn.classList.remove('is-dragging');
                btn.style.transform = 'translateX(0px) scale(1)';
                currentX = 0;
            }

            btn.addEventListener('pointerup', endDrag);
            btn.addEventListener('pointercancel', endDrag);
        })();
    </script>
</body>
</html>
